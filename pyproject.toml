[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-dollar"
version = "0.1.0"
description = "Configuration-driven multi-person travel expense ledger and settlement engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Trip Dollar contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "Flask>=3.1,<4", "waitress>=3,<4"]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
trip-dollar = "trip_dollar.cli:main"
trip-dollar-web = "trip_dollar.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_dollar"]

[tool.hatch.build]
dev-mode-dirs = ["src", "vendor/bobowatch"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/bobowatch/bobowatch/__init__.py" = "bobowatch/__init__.py"
"vendor/bobowatch/bobowatch/adapter.py" = "bobowatch/adapter.py"
"vendor/bobowatch/bobowatch/protocol.py" = "bobowatch/protocol.py"
"vendor/bobowatch/bobowatch/wsgi.py" = "bobowatch/wsgi.py"
"vendor/bobowatch/bobowatch/client.py" = "bobowatch/client.py"
"vendor/bobowatch/bobowatch/config.py" = "bobowatch/config.py"
"vendor/bobowatch/bobowatch/paths.py" = "bobowatch/paths.py"
"vendor/bobowatch/bobowatch/provision.py" = "bobowatch/provision.py"

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/bobowatch"]
testpaths = ["tests"]
