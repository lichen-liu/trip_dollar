[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-dollar"
version = "0.1.0"
description = "Configuration-driven multi-person travel expense ledger and settlement engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Trip Dollar contributors"}]
dependencies = [
  "boboji-bobowatch-adapter @ https://github.com/lichen-liu/boboji/releases/download/bobowatch-adapter/v0.3.0/boboji_bobowatch_adapter-0.3.0-py3-none-any.whl#sha256=f28b1b69927b26758c225d979f7fb20c20c8763e5fea0d52a1e2d8ad221d3fdc",
]

[project.optional-dependencies]
dev = ["pytest>=8", "Flask>=3.1,<4", "waitress>=3,<4"]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
trip-dollar = "trip_dollar.cli:main"
trip-dollar-web = "trip_dollar.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_dollar"]

[tool.hatch.build]
dev-mode-dirs = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
