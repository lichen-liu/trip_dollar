[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-dollar"
version = "0.1.0"
description = "Configuration-driven multi-person travel expense ledger and settlement engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Trip Dollar contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "Flask>=3.1,<4", "waitress>=3,<4"]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
trip-dollar = "trip_dollar.cli:main"
trip-dollar-web = "trip_dollar.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trip_dollar.frontend" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.json", "static/*.svg", "static/fonts/*.woff2", "static/fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
